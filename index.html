<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Wars Crawl</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <article class="starwars">
        <div class="film-grain"></div>
        <div class="stars"></div>
        <div class="twinkling-stars"></div>

        <audio id="theme-audio" preload="auto">
            <source src="https://s.cdpn.io/1202/Star_Wars_original_opening_crawl_1977.ogg" type="audio/ogg" />
            <source src="https://s.cdpn.io/1202/Star_Wars_original_opening_crawl_1977.mp3" type="audio/mpeg" />
        </audio>

        <!-- Tela Inicial -->
        <div class="start-screen">
            <div class="start-panel">
                <label for="episode-select">Escolha o episódio:</label>
                <select id="episode-select">
                    <option value="iv" selected>Episódio IV – Uma Nova Esperança</option>
                    <option value="v">Episódio V – O Império Contra-Ataca</option>
                    <option value="vi">Episódio VI – O Retorno de Jedi</option>
                </select>
                <button id="start-btn">Começar</button>
            </div>
        </div>

        <section class="intro">Há muito tempo, numa galáxia muito, muito distante...</section>

        <section class="titles">
            <div id="crawl-text"></div>
        </section>

        <div class="controls">
            <button id="restart-btn">⟳ Recomeçar</button>
            <button id="audio-toggle">🔊</button>
            <input id="audio-volume" type="range" min="0" max="1" step="0.01" value="1">
        </div>
    </article>

    <script src="script.js"></script>
</body>

</html>
